services:
  - type: web
    name: nids-main-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 100 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: NIDS_SECRET_KEY
        generateValue: true
      - key: NIDS_PUBLIC_DEMO
        value: "1"
      - key: NIDS_CAPTURE_ENABLED
        value: "0"
      - key: ATTACK_AUTOMATION_ENABLED
        value: "0"
      - key: NIDS_MAX_FILE_BYTES
        value: "1048576"
